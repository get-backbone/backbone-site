<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Community licence | Backbone</title>
    <meta
      name="description"
      content="Get a free Backbone Community developer licence for non-production native-image development." />
    <link href="https://backbonehq.io/licence/" rel="canonical" />
    <link rel="stylesheet" href="/assets/css/main.css" media="all" />
    <script type="module" src="/assets/js/layout-shell.js"></script>
    <script src="/assets/js/licence-accept.js" defer></script>
  </head>
  <body class="helvetica bg-[#0B0C14] text-neutral-200">
    <div class="main overflow-x-hidden has-top-glow">
      <div id="site-header"></div>

      <main class="page-rail pt-32 pb-24">
        <header class="max-w-[640px]" style="text-wrap: pretty">
          <h1 class="font-helveticaDisplay text-white font-bold text-[40px] leading-[110%]">
            Community licence
          </h1>
          <p class="mt-4 text-neutral-200 text-lg leading-[145%]">
            One year of free development on the Backbone platform.
          </p>
        </header>

        <hr
          class="page-rail-separator separator-margin-y-compact border-0 border-t border-image-t border-separator-gradient"
          aria-hidden="true" />

        <div class="max-w-[640px] space-y-6 text-neutral-300 leading-[165%]" style="text-wrap: pretty">
          <p>
            Continue with GitHub so we can issue a signed Community licence file for your GitHub organization
            (or personal account for sole developer).<br />
            One active Community licence per org or account.
          </p>

          <label class="flex items-start gap-3 cursor-pointer text-13 text-neutral-300 leading-[145%]">
            <input
              id="licence-accept"
              type="checkbox"
              class="mt-1 h-4 w-4 shrink-0 rounded border border-[#939DB8]/40 bg-[#0F101A] accent-[#7C87F7]"
              aria-controls="licence-github-start" />
            <span>
              I agree to the
              <a
                class="text-[#7C87F7] hover:underline"
                href="https://github.com/get-backbone/backbone-community/blob/main/LICENCE_COMMUNITY.md"
                rel="noopener noreferrer"
                target="_blank"
                >Backbone Community Licence</a
              >
              and understand that a signed Community licence file is required to use Community native images and
              other protected Backbone components.
            </span>
          </label>

          <a
            id="licence-github-start"
            class="cta-button inline-flex items-center justify-center rounded-lg px-6 py-3 text-sm font-medium text-white opacity-40 pointer-events-none"
            href="https://licence.backbonehq.io/oauth/github/start"
            aria-disabled="true"
            tabindex="-1">
            Continue with GitHub
          </a>
        </div>
      </main>

      <div id="site-footer"></div>
    </div>
  </body>
</html>
